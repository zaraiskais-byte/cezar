name: C CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev
      - name: build
        run: |
          set -o pipefail
          make 2>&1 | tee build.log
      - name: test
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cezar-linux
          path: build/cezar
